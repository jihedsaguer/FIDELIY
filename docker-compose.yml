version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fideliy-postgres
    environment:
      POSTGRES_USER: fideliy_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fideliy_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fideliy_dev -d fideliy_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fideliy-network

volumes:
  postgres_data:
    driver: local

networks:
  fideliy-network:
    driver: bridge
