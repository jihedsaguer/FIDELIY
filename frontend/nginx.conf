# Local production-like smoke test only (docker-compose.prod.yml).
# Mimics the Cloudflare Worker: serves the SPA and proxies /api/ to the
# backend, overwriting X-Client-IP with the real client address.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Logo uploads are capped at 5 MB by the backend.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
